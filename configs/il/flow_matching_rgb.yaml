device: cuda:0
seed: 42
horizon_steps: 16
denoising_steps: 20
train:
  n_epochs: 200
  batch_size: 64
  learning_rate: 0.0001
  weight_decay: 1.0e-06
  lr_scheduler:
    first_cycle_steps: 200
    warmup_steps: 5
    min_lr: 1.0e-05
  epoch_start_ema: 20
  update_ema_freq: 10
  save_model_freq: 10
  val_freq: 1
model:
  network:
    backbone:
      obs_shape:
      - 3
      - 96
      - 96
      num_channel: 3
      cfg:
        patch_size: 8
        depth: 1
        embed_dim: 128
        num_heads: 4
        embed_style: embed2
        embed_norm: 0
    img_cond_steps: 1
    augment: true
    spatial_emb: 128
    time_dim: 32
    mlp_dims:
    - 512
    - 512
    - 512
    residual_style: true
    cond_dim: 6
    horizon_steps: 16
    action_dim: 6
  device: cuda:0
  horizon_steps: 16
  action_dim: 6
  act_min: -1
  act_max: 1
  obs_dim: 6
  max_denoising_steps: 20
  seed: 42
  sample_t_type: uniform
ema:
  decay: 0.995
train_dataset:
  horizon_steps: 16
  cond_steps: 1
  img_cond_steps: 1
  max_n_episodes: -1
  use_img: true
  device: cuda:0
val_dataset:
  horizon_steps: 16
  cond_steps: 1
  img_cond_steps: 1
  max_n_episodes: -1
  use_img: true
  device: cuda:0
